name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          # Build-time placeholders only. Runtime routes fail closed if real
          # secrets are absent; these values prevent accidental env parsing
          # failures while compiling the application in CI.
          SUPABASE_URL: https://example.invalid
          SUPABASE_SERVICE_KEY: ci-placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
