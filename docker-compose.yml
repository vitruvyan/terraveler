name: terraveler

networks:
  terraveler_net:
    name: terraveler_net

volumes:
  terraveler_pgdata:
  terraveler_hf_cache:
  terraveler_redisdata:

services:
  terraveler_postgres:
    image: pgvector/pgvector:pg16
    container_name: terraveler_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: terraveler
      POSTGRES_USER: terraveler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:6000:5432"
    volumes:
      - terraveler_pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - terraveler_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U terraveler -d terraveler"]
      interval: 10s
      timeout: 5s
      retries: 5

  terraveler_redis:
    image: redis:7.4-alpine
    container_name: terraveler_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes",
              "--maxmemory", "256mb", "--maxmemory-policy", "noeviction",
              "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - terraveler_redisdata:/data
    networks:
      - terraveler_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  terraveler_embedding:
    build:
      context: ./embedding
    image: terraveler-embedding
    container_name: terraveler_embedding
    restart: unless-stopped
    environment:
      EMBEDDING_MODEL: nomic-ai/nomic-embed-text-v1.5
      EMBEDDING_VISION_MODEL: nomic-ai/nomic-embed-vision-v1.5
      EMBEDDING_VISION_REVISION: 9e4269d0524e
      HF_HOME: /cache/hf
      PORT: 8010
    ports:
      - "127.0.0.1:6002:8010"
    volumes:
      - terraveler_hf_cache:/cache/hf
    networks:
      - terraveler_net

  terraveler_ingest:
    build:
      context: ./ingest
    image: terraveler-ingest
    container_name: terraveler_ingest
    profiles: ["jobs"]
    environment:
      EMBED_URL: http://terraveler_embedding:8010
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CURATOR_MODEL: ${CURATOR_MODEL:-gpt-4.1}
      PGHOST: terraveler_postgres
      PGPORT: 5432
      PGDATABASE: terraveler
      PGUSER: terraveler
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./traces:/app/traces
      - ./out:/app/out
      - ./ingest:/app
    networks:
      - terraveler_net

  terraveler_rag:
    build:
      context: ./rag
    image: terraveler-rag
    container_name: terraveler_rag
    restart: unless-stopped
    environment:
      EMBED_URL: http://terraveler_embedding:8010
      RAG_TOKEN: ${RAG_TOKEN}
      # The chat writer is routed through OpenRouter. The RAG service no longer
      # reads ANTHROPIC_API_KEY directly; provider choice is expressed by the
      # OpenRouter model slug instead.
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-~anthropic/claude-opus-latest}
      RAG_K: ${RAG_K:-6}
      PGHOST: terraveler_postgres
      PGPORT: 5432
      PGDATABASE: terraveler
      PGUSER: terraveler
      PGPASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "6003:8000"
    networks:
      - terraveler_net

  terraveler_officers:
    build:
      context: ./officers
    image: terraveler-officers
    container_name: terraveler_officers
    restart: unless-stopped
    depends_on:
      terraveler_postgres:
        condition: service_healthy
      terraveler_redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD}@terraveler_redis:6379
      PGHOST: terraveler_postgres
      PGPORT: "5432"
      PGDATABASE: terraveler
      PGUSER: terraveler
      PGPASSWORD: ${POSTGRES_PASSWORD}
      REPO: /repo
      OFFICERS_MOORED: ${OFFICERS_MOORED:-0}
    volumes:
      - ./scripts:/repo/scripts:ro
      - ./ingest:/repo/ingest:ro
      - ./MAGNA_CARTA.md:/repo/MAGNA_CARTA.md:ro
    ports:
      - "127.0.0.1:6005:8080"
    networks:
      - terraveler_net
    mem_limit: 768m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=5).status == 200 else 1)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  terraveler_postgrest:
    image: postgrest/postgrest:v12.2.3
    container_name: terraveler_postgrest
    restart: unless-stopped
    depends_on:
      terraveler_postgres:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://authenticator:${PGRST_DB_PASSWORD}@terraveler_postgres:5432/terraveler
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: terraveler_anon
      PGRST_JWT_SECRET: ${PGRST_JWT_SECRET}
      PGRST_DB_POOL: 10
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:6004:3000"
    networks:
      - terraveler_net
